name: Monday Stock Buy Alert

on:
  schedule:
    # 04:30 UTC every Monday = 10:00 AM IST
    - cron: '30 4 * * 1'
  workflow_dispatch: # Allows manual trigger anytime from GitHub mobile app or web

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance requests

      - name: Run Market & News Monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'hari.mba000@gmail.com' }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS || 'yoll icus ollp glmx' }}
          ALERT_RECEIVER: ${{ secrets.ALERT_RECEIVER || 'hari.mba000@gmail.com' }}
        run: |
          python cloud_market_monitor.py
