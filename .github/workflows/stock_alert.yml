name: Continuous Market Stock Monitor (9:15 AM - 3:30 PM)

on:
  schedule:
    # 03:45 UTC = 9:15 AM IST, Monday through Friday
    - cron: '45 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  continuous-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 390 # 6.5 hours duration (9:15 AM to 3:30 PM)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance requests

      - name: Run Real-Time Stock & News Monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ALERT_RECEIVER: ${{ secrets.ALERT_RECEIVER }}
        run: |
          python cloud_market_monitor.py
